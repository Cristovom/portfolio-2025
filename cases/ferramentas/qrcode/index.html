<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="gerador de QR Code, criar QR Code grátis, QR Code online, converter link em QR Code, código QR gratuito, QR Code personalizado">
    <meta name="description" content="Gere QR Code gratuitamente de forma rápida e fácil. Converta links, textos, telefones e muito mais em códigos QR personalizados.">

    <title>QRCode - Gere para links e contatos</title>
    <link rel="shortcut icon" href="../../../assets/svg/favicon.svg" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style2.css">
</head>
<body class="min-h-screen">
    <header class="header bg-[#8184d2] w-[100%] p-[20px] md:py-[10px]">
        <div class="flex items-center justify-between gap-[20px] md:w-[90%] md:m-auto max-w-[1140px]">
            <a href="https://cristovom.github.io/Portfolio-2025/" role="link" aria-label="Portfólio" title="Portfólio" class="logo inline-block w-[80px]">
                <svg class="rotating-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- Círculo de fundo -->
                    <circle cx="100" cy="100" r="75" fill="black" />
                    
                    <!-- Texto superior (Ano) -->
                    <path id="topText" d="M 50,100 A 50,50 0 1,1 150,100" fill="none" />
                    <text>
                        <textPath href="#topText" startOffset="50%" text-anchor="middle" class="year">
                        2025
                        </textPath>
                    </text>
                
                    <!-- Texto inferior -->
                    <path id="bottomText" d="M 150,100 A 50,50 0 1,1 50,100" fill="none" />
                    <text>
                        <textPath href="#bottomText" startOffset="50%" text-anchor="middle">PORTFÓLIO</textPath>
                    </text>
                </svg>
            </a>

            <nav class="redes-sociais">
                <ul class="list-none flex items-center gap-[20px]">
                    <li class="flex items-center">
                        <a href="https://www.instagram.com/cristovom_nunes/" target="_blank" role="link" aria-label="Instagram" title="Instagram" class="inline-block w-100 w-[30px] min-h-[30px] insta"></a>
                    </li>
                    <li class="flex items-center">
                        <a href="https://www.linkedin.com/in/cristovom/" target="_blank" role="link" aria-label="LinkedIn" title="LinkedIn" class="inline-block w-100 w-[30px] min-h-[30px] linkedin"></a>
                    </li>
                    <li class="flex items-center">
                        <a href="#" role="link" aria-label="Behance" title="Behance" class="inline-block w-100 w-[30px] min-h-[30px] behance"></a>
                    </li>
                    <li class="flex items-center">
                        <a href="https://github.com/Cristovom" target="_blank" role="link" aria-label="Github" title="Github" class="inline-block w-100 w-[30px] min-h-[30px] github"></a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="flex flex-wrap items-center flex-column justify-between gap-[20px] border p-[30px] xl:p-[50px] w-95 md:w-[90%] max-w-[1140px] m-auto my-10 rounded-xl">
            <div class="content-description w-full md:w-[47%]">
                <h1 class="text-[32px]/[1.2em] md:text-[46px]">Converta seu link para QR code</h1>

                <div class="py-3 md:py-[30px]">
                    <label for="url" class="text-[18px]">Digite a URL:</label>
                    <input type="text" name="d" id="url" class="mt-3 border rounded-full w-full py-[12px] px-[25px]" placeholder="Digite a URL" onkeyup="geraQRcode()">
                </div>
            </div>
            <hr>
            <div class="content-qrcode p-[30px] border border-[#d9d9d9] rounded-xl w-full flex flex-wrap flex-column gap-[30px] justify-center text-center md:w-[47%]">
                <h2 class="text-[20px]/[1.2em]">Seu QRCode será gerado automaticamente após preencher o campo acima:</h2>
                <div id="qrcode" class="w-full flex justify-center">
                    <img src="assets/img/qrcode.png" alt="QR Code exemplo" class="object-cover opacity-[.5]">
                </div>
                <button type="button" id="download-qr-btn" class="inline-block border-[0px] border py-[12px] px-[35px] bg-[#8184d2] rounded-full text-white cursor-pointer">Baixar</button>
            </div>
        </div>
    </main>
    
    <script src="assets/js/main.js"></script>
</body>
</html>
