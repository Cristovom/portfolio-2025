<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Contato - Fiscaliza Brasil</title>
		<script src="https://cdn.tailwindcss.com"></script>
	</head>
	<body class="bg-gray-100 text-gray-900">
		<!-- HEADER -->
        <header class="bg-white shadow p-4">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="text-2xl font-bold">Glossário Político</h1>
                <input type="text" placeholder="Buscar por nome ou estado" class="p-2 border rounded w-64" />
            </div>
        </header>
		<main class="container mx-auto mt-8 max-w-2xl">
			<section class="mb-6">
				<h1 class="text-2xl font-bold mb-2">Entre em contato</h1>
				<p class="text-sm text-gray-700">
					Envie sugestões, denúncias sobre políticos ou qualquer feedback sobre o site.
				</p>
			</section>
            <section class="bg-white p-6 rounded-xl shadow">
                <form class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
                        <input type="text" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Seu nome (opcional)">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                        <input type="email" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Seu e-mail (opcional)">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de mensagem</label>
                        <select class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="feedback">Feedback</option>
                            <option value="denuncia">Denúncia</option>
                            <option value="sugestao">Sugestão</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Mensagem</label>
                        <textarea rows="6" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Digite sua mensagem..."></textarea>
                    </div>

                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded-lg transition">Enviar</button>
                </form>
            </section>
		</main>
        <footer class="mt-12 p-6 bg-white shadow-inner text-center text-sm text-gray-500">
            Dados públicos da Câmara e Senado — Fiscaliza Brasil © 2025
        </footer>
	</body>
</html>
