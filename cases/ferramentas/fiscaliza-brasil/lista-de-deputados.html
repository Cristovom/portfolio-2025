<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Deputados - Fiscaliza Brasil</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 text-gray-900">
        <header class="bg-white shadow p-4">
            <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Deputados</h1>
            <input type="text" placeholder="Buscar por nome ou estado" class="p-2 border rounded w-64" />
            </div>
        </header>

        <main class="container mx-auto mt-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <div class="bg-white p-4 rounded-xl shadow">
                <h2 class="text-lg font-semibold">Maria Souza</h2>
                <p class="text-sm text-gray-600">Partido XYZ - SP</p>
                <p class="mt-2 text-sm">Presença: 93%</p>
                <p class="text-sm">Projetos: 12</p>
                <a href="#" class="text-blue-500 text-sm mt-2 inline-block">Ver perfil →</a>
            </div>
            <div class="bg-white p-4 rounded-xl shadow">
                <h2 class="text-lg font-semibold">João Silva</h2>
                <p class="text-sm text-gray-600">Partido ABC - RJ</p>
                <p class="mt-2 text-sm">Presença: 62%</p>
                <p class="text-sm">Projetos: 3</p>
                <a href="#" class="text-blue-500 text-sm mt-2 inline-block">Ver perfil →</a>
            </div>
            <!-- Mais cards... -->
            </div>
        </main>

        <footer class="mt-12 p-6 bg-white shadow-inner text-center text-sm text-gray-500">
            Dados públicos da Câmara e Senado — Fiscaliza Brasil © 2025
        </footer>
    </body>
</html>
